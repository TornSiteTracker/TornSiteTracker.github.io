<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn Target Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 2.2rem;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .admin-badge {
            display: none;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            border: 1px solid #22c55e;
            color: #22c55e;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .admin-badge.visible {
            display: inline-flex;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 24px;
            text-align: center;
            min-width: 120px;
        }
        .stat-box .number {
            font-size: 1.6rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .stat-box .label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .controls input, .controls select {
            background: #1e293b;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .controls input:focus, .controls select:focus {
            border-color: #38bdf8;
        }
        .controls input[type="text"] {
            min-width: 220px;
        }
        .btn {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background: #0284c7;
            transform: translateY(-1px);
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-success {
            background: #22c55e;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-secondary {
            background: #475569;
        }
        .btn-secondary:hover {
            background: #334155;
        }
        .btn-admin {
            background: #a855f7;
        }
        .btn-admin:hover {
            background: #9333ea;
        }
        .btn-logout {
            background: #64748b;
        }
        .btn-logout:hover {
            background: #475569;
        }
        .admin-only {
            display: none !important;
        }
        .admin-only.visible {
            display: inline-flex !important;
        }
        .add-form {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: none;
        }
        .add-form.active {
            display: block;
        }
        .add-form h3 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .form-row input, .form-row select {
            flex: 1;
            min-width: 140px;
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .form-row input::placeholder {
            color: #64748b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        thead {
            background: #0f172a;
        }
        th {
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
            position: relative;
            white-space: nowrap;
        }
        th:hover {
            color: #38bdf8;
        }
        th .sort-icon {
            margin-left: 4px;
            opacity: 0.5;
            font-size: 0.75rem;
        }
        th.sorted .sort-icon {
            opacity: 1;
            color: #38bdf8;
        }
        td {
            padding: 12px;
            border-top: 1px solid #334155;
            font-size: 0.9rem;
        }
        tr:hover {
            background: #252f47;
        }
        .name-cell {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .username {
            font-weight: 600;
            color: #e2e8f0;
        }
        .player-id {
            font-size: 0.8rem;
            color: #64748b;
        }
        .player-id a {
            color: #38bdf8;
            text-decoration: none;
        }
        .player-id a:hover {
            text-decoration: underline;
        }
        .level-badge {
            display: inline-block;
            background: #0f172a;
            border: 1px solid #475569;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #e2e8f0;
        }
        .ff-badge {
            display: inline-block;
            background: #0f172a;
            border: 1px solid #475569;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .ff-1 { color: #ef4444; border-color: #ef4444; }
        .ff-2 { color: #f97316; border-color: #f97316; }
        .ff-3 { color: #eab308; border-color: #eab308; }
        .ff-4 { color: #22c55e; border-color: #22c55e; }
        .ff-5 { color: #38bdf8; border-color: #38bdf8; }
        .stats-value {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #a78bfa;
        }
        .inactive {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .inactive.warn {
            color: #f97316;
        }
        .inactive.danger {
            color: #ef4444;
            font-weight: 600;
        }
        .actions {
            display: flex;
            gap: 6px;
        }
        .actions button {
            background: #334155;
            border: none;
            color: #e2e8f0;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .actions button:hover {
            background: #475569;
        }
        .actions .btn-del:hover {
            background: #ef4444;
            color: white;
        }
        .actions .btn-edit:hover {
            background: #0ea5e9;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }
        .empty-state h3 {
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success { border-left: 4px solid #22c55e; }
        .toast.error { border-left: 4px solid #ef4444; }
        .toast.info { border-left: 4px solid #38bdf8; }
        .login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .login-modal.active {
            display: flex;
        }
        .login-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }
        .login-box h3 {
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        .login-box input:focus {
            outline: none;
            border-color: #a855f7;
        }
        .login-box .btn {
            width: 100%;
            justify-content: center;
        }
        .login-box .cancel-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }
        .login-box .cancel-btn:hover {
            color: #e2e8f0;
        }
        @media (max-width: 768px) {
            th, td {
                padding: 8px 6px;
                font-size: 0.8rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls input, .controls select, .controls button {
                width: 100%;
            }
            .form-row {
                flex-direction: column;
            }
            .form-row input, .form-row select {
                width: 100%;
            }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>

            { name: "GothamPanda", id: "3113043", level: 4, ff: 3, stats: 190, inactive: "1 month ago" },
            { name: "TheOnlyZyZy", id: "4233077", level: 5, ff: 3, stats: 190, inactive: "1 month ago" },
            { name: "penzo78", id: "4180664", level: 3, ff: 3, stats: 190, inactive: "1 month ago" },
            { name: "Mammon_maximus", id: "4250292", level: 4, ff: 3, stats: 190, inactive: "1 month ago" },
            { name: "pakalvin", id: "4246937", level: 5, ff: 3, stats: 190, inactive: "1 month ago" },
            { name: "HeshanZ", id: "3811872", level: 2, ff: 3, stats: 190, inactive: "1 month ago" }
        ];

        // ===================== STATE =====================
        let targets = [];
        let sortCol = 'inactive';
        let sortDir = 'asc';
        let editIndex = -1;
        let isAdmin = false;

        // ===================== INIT =====================
        function init() {
            const saved = localStorage.getItem('tornTargets');
            if (saved) {
                targets = JSON.parse(saved);
            } else {
                targets = [...defaultTargets];
                saveTargets();
            }
            // Check admin session
            const adminSession = localStorage.getItem('tornAdmin');
            if (adminSession === 'true') {
                isAdmin = true;
            }
            updateAdminUI();
            render();
            updateStats();
        }

        function saveTargets() {
            localStorage.setItem('tornTargets', JSON.stringify(targets));
        }

        // ===================== ADMIN UI =====================
        function updateAdminUI() {
            const loginBtn = document.getElementById('loginBtn');
            const adminBadge = document.getElementById('adminBadge');
            const adminOnlyElements = document.querySelectorAll('.admin-only');
            const actionsHeader = document.getElementById('actionsHeader');

            if (isAdmin) {
                loginBtn.style.display = 'none';
                adminBadge.classList.add('visible');
                adminOnlyElements.forEach(el => el.classList.add('visible'));
                if (actionsHeader) actionsHeader.style.display = 'table-cell';
            } else {
                loginBtn.style.display = 'inline-flex';
                adminBadge.classList.remove('visible');
                adminOnlyElements.forEach(el => el.classList.remove('visible'));
                if (actionsHeader) actionsHeader.style.display = 'none';
                // Hide forms if open
                document.getElementById('addForm').classList.remove('active');
                document.getElementById('editForm').classList.remove('active');
            }
        }

        function showLogin() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginPassword').focus();
        }

        function hideLogin() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function doLogin() {
            const pw = document.getElementById('loginPassword').value;
            if (pw === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('tornAdmin', 'true');
                hideLogin();
                updateAdminUI();
                render();
                showToast('Logged in as Admin!', 'success');
            } else {
                showToast('Wrong password!', 'error');
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginPassword').focus();
            }
        }

        function logout() {
            isAdmin = false;
            localStorage.removeItem('tornAdmin');
            updateAdminUI();
            render();
            showToast('Logged out', 'info');
        }

        // ===================== RENDER =====================
        function render() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const ffFilter = document.getElementById('filterFF').value;
            const levelFilter = document.getElementById('filterLevel').value;

            let filtered = targets.filter(t => {
                const matchSearch = t.name.toLowerCase().includes(search) || t.id.includes(search);
                const matchFF = !ffFilter || t.ff == ffFilter;
                const matchLevel = !levelFilter || t.level == levelFilter;
                return matchSearch && matchFF && matchLevel;
            });

            filtered.sort((a, b) => {
                let va = a[sortCol];
                let vb = b[sortCol];
                if (sortCol === 'inactive') {
                    va = inactiveToDays(va);
                    vb = inactiveToDays(vb);
                }
                if (typeof va === 'string') va = va.toLowerCase();
                if (typeof vb === 'string') vb = vb.toLowerCase();
                if (va < vb) return sortDir === 'asc' ? -1 : 1;
                if (va > vb) return sortDir === 'asc' ? 1 : -1;
                return 0;
            });

            const tbody = document.getElementById('targetTable');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 6 : 5}"><div class="empty-state"><h3>No targets found</h3><p>Try adjusting your filters or add new targets.</p></div></td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((t, i) => {
                const realIndex = targets.indexOf(t);
                const inactiveClass = getInactiveClass(t.inactive);
                const actionsCell = isAdmin ? `
                    <td>
                        <div class="actions">
                            <button class="btn-edit" onclick="editTarget(${realIndex})">✏️</button>
                            <button class="btn-del" onclick="deleteTarget(${realIndex})">🗑️</button>
                        </div>
                    </td>` : '';
                return `
                <tr>
                    <td>
                        <div class="name-cell">
                            <span class="username">${escapeHtml(t.name)}</span>
                            <span class="player-id"><a href="https://www.torn.com/profiles.php?XID=${t.id}" target="_blank">[${t.id}]</a></span>
                        </div>
                    </td>
                    <td><span class="level-badge">${t.level}</span></td>
                    <td><span class="ff-badge ff-${t.ff}">${t.ff}</span></td>
                    <td><span class="stats-value">${t.stats.toLocaleString()}</span></td>
                    <td><span class="inactive ${inactiveClass}">${escapeHtml(t.inactive)}</span></td>
                    ${actionsCell}
                </tr>`;
            }).join('');

            // Update sort icons
            document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
            const activeTh = document.getElementById('sort-' + sortCol);
            if (activeTh) {
                activeTh.parentElement.classList.add('sorted');
                activeTh.textContent = sortDir === 'asc' ? '▲' : '▼';
            }
        }

        function updateStats() {
            document.getElementById('totalTargets').textContent = targets.length;
            const avgLevel = targets.length ? (targets.reduce((s, t) => s + Number(t.level), 0) / targets.length).toFixed(1) : 0;
            const avgFF = targets.length ? (targets.reduce((s, t) => s + Number(t.ff), 0) / targets.length).toFixed(1) : 0;
            const inactive15 = targets.filter(t => inactiveToDays(t.inactive) >= 15).length;
            document.getElementById('avgLevel').textContent = avgLevel;
            document.getElementById('avgFF').textContent = avgFF;
            document.getElementById('inactiveCount').textContent = inactive15;
        }

        // ===================== SORTING =====================
        function sortBy(col) {
            if (sortCol === col) {
                sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                sortCol = col;
                sortDir = 'asc';
            }
            ['name','level','ff','stats','inactive'].forEach(c => {
                const el = document.getElementById('sort-' + c);
                if (el) el.textContent = '↕';
            });
            render();
        }

        // ===================== ADD =====================
        function toggleAddForm() {
            if (!isAdmin) return;
            const form = document.getElementById('addForm');
            form.classList.toggle('active');
            if (form.classList.contains('active')) {
                document.getElementById('newName').focus();
                closeEditForm();
            }
        }

        function addTarget() {
            if (!isAdmin) return;
            const name = document.getElementById('newName').value.trim();
            const id = document.getElementById('newId').value.trim();
            let level = parseInt(document.getElementById('newLevel').value);
            const ff = document.getElementById('newFF').value;
            const stats = document.getElementById('newStats').value;
            const inactive = document.getElementById('newInactive').value.trim();

            if (!name || !id) {
                showToast('Username and ID are required!', 'error');
                return;
            }

            // Validate level range
            if (isNaN(level) || level < 1 || level > 100) {
                showToast('Level must be between 1 and 100!', 'error');
                return;
            }

            targets.push({
                name, id, level: level, ff: ff || 3,
                stats: stats ? Number(stats) : 0,
                inactive: inactive || 'Unknown'
            });
            saveTargets();
            render();
            updateStats();
            showToast('Target added successfully!', 'success');

            document.getElementById('newName').value = '';
            document.getElementById('newId').value = '';
            document.getElementById('newLevel').value = '';
            document.getElementById('newFF').value = '';
            document.getElementById('newStats').value = '';
            document.getElementById('newInactive').value = '';
        }

        // ===================== EDIT =====================
        function editTarget(index) {
            if (!isAdmin) return;
            const t = targets[index];
            editIndex = index;
            document.getElementById('editIndex').value = index;
            document.getElementById('editName').value = t.name;
            document.getElementById('editId').value = t.id;
            document.getElementById('editLevel').value = t.level;
            document.getElementById('editFF').value = t.ff;
            document.getElementById('editStats').value = t.stats;
            document.getElementById('editInactive').value = t.inactive;
            document.getElementById('editForm').classList.add('active');
            document.getElementById('addForm').classList.remove('active');
        }

        function saveEdit() {
            if (!isAdmin || editIndex < 0) return;
            const name = document.getElementById('editName').value.trim();
            const id = document.getElementById('editId').value.trim();
            let level = parseInt(document.getElementById('editLevel').value);
            if (!name || !id) {
                showToast('Username and ID are required!', 'error');
                return;
            }
            // Validate level range
            if (isNaN(level) || level < 1 || level > 100) {
                showToast('Level must be between 1 and 100!', 'error');
                return;
            }
            targets[editIndex] = {
                name,
                id,
                level: level,
                ff: document.getElementById('editFF').value || 3,
                stats: Number(document.getElementById('editStats').value) || 0,
                inactive: document.getElementById('editInactive').value.trim() || 'Unknown'
            };
            saveTargets();
            render();
            updateStats();
            closeEditForm();
            showToast('Target updated!', 'success');
        }

        function closeEditForm() {
            document.getElementById('editForm').classList.remove('active');
            editIndex = -1;
        }

        // ===================== DELETE =====================
        function deleteTarget(index) {
            if (!isAdmin) return;
            if (!confirm('Delete ' + targets[index].name + '?')) return;
            targets.splice(index, 1);
            saveTargets();
            render();
            updateStats();
            showToast('Target deleted', 'info');
        }

        function clearAll() {
            if (!isAdmin) return;
            if (!confirm('Delete ALL targets? This cannot be undone!')) return;
            targets = [];
            saveTargets();
            render();
            updateStats();
            showToast('All targets cleared', 'info');
        }

        // ===================== EXPORT =====================
        function exportData() {
            const data = JSON.stringify(targets, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'torn-targets-' + new Date().toISOString().slice(0,10) + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Data exported!', 'success');
        }

        // ===================== HELPERS =====================
        function inactiveToDays(str) {
            if (!str) return 999;
            const s = str.toLowerCase().trim();
            const m = s.match(/(\d+)\s*day/);
            if (m) return parseInt(m[1]);
            if (s.includes('month')) {
                const mm = s.match(/(\d+)\s*month/);
                return (mm ? parseInt(mm[1]) : 1) * 30;
            }
            if (s.includes('year')) {
                const ym = s.match(/(\d+)\s*year/);
                return (ym ? parseInt(ym[1]) : 1) * 365;
            }
            return 999;
        }

        function getInactiveClass(str) {
            const days = inactiveToDays(str);
            if (days >= 30) return 'danger';
            if (days >= 20) return 'warn';
            return '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ===================== EVENT LISTENERS =====================
        document.getElementById('searchInput').addEventListener('input', render);
        document.getElementById('filterFF').addEventListener('change', render);
        document.getElementById('filterLevel').addEventListener('change', render);

        document.getElementById('loginPassword').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });

        document.getElementById('addForm').addEventListener('keydown', e => {
            if (e.key === 'Enter') addTarget();
        });

        // Init
        init();
    </script>
